<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" width="100%" role="img" aria-labelledby="tj">
<title id="tj">Recorrido de una pulsación: del móvil a la red WiFi de casa, de ahí a KeyForge en el PC, y de ahí a la acción</title>

<defs>
<path id="tren" d="M180 115 H1020" fill="none"/>
<marker id="fk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#2A2A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.caja{fill:#12121C;stroke:#2A2A3A;stroke-width:1}
.tit{font-size:13px;fill:#F2F0FF}
.sub{font-size:11px;fill:#6A6A85}
</style>

<rect width="1200" height="260" rx="20" fill="#07070C"/>

<g stroke="#2A2A3A" stroke-width="1">
<line x1="296" y1="115" x2="344" y2="115" marker-end="url(#fk)"/>
<line x1="576" y1="115" x2="624" y2="115" marker-end="url(#fk)"/>
<line x1="856" y1="115" x2="904" y2="115" marker-end="url(#fk)"/>
</g>

<g class="caja">
<rect x="70" y="72" width="220" height="86" rx="12" stroke="#00E5FF"/>
<rect x="350" y="72" width="220" height="86" rx="12" stroke="#B026FF"/>
<rect x="630" y="72" width="220" height="86" rx="12" stroke="#B026FF"/>
<rect x="910" y="72" width="220" height="86" rx="12" stroke="#00E5FF"/>
</g>

<text class="m tit" x="180" y="105" text-anchor="middle">tu móvil</text>
<text class="m sub" x="180" y="124" text-anchor="middle">pulsas un botón</text>
<text class="m sub" x="180" y="140" text-anchor="middle">del deck</text>

<text class="m tit" x="460" y="105" text-anchor="middle">tu WiFi</text>
<text class="m sub" x="460" y="124" text-anchor="middle">nada sale de casa,</text>
<text class="m sub" x="460" y="140" text-anchor="middle">no hay nube ni cuentas</text>

<text class="m tit" x="740" y="105" text-anchor="middle">KeyForge en el PC</text>
<text class="m sub" x="740" y="124" text-anchor="middle">recibe la orden</text>
<text class="m sub" x="740" y="140" text-anchor="middle">y la ejecuta</text>

<text class="m tit" x="1020" y="105" text-anchor="middle">la acción</text>
<text class="m sub" x="1020" y="124" text-anchor="middle">programa, atajo, macro,</text>
<text class="m sub" x="1020" y="140" text-anchor="middle">OBS, música o luces</text>

<circle r="5" fill="#00E5FF">
  <animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#tren"/></animateMotion>
</circle>

<text class="m" x="600" y="204" text-anchor="middle" font-size="11.5" fill="#4E4E63">el emparejamiento es un QR, y el enlace de traspaso a otro PC caduca en un solo uso</text>
</svg>
