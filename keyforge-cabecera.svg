<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-labelledby="tk">
<title id="tk">KeyForge, tu móvil como mando a distancia del PC, ejecutando una macro con espera entre pasos</title>

<defs>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="1" stop-color="#B026FF"/>
</linearGradient>
<clipPath id="mk"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>

<style>
.d{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.paso rect{fill:#16161F;stroke:#ffffff;stroke-opacity:.07;stroke-width:1}
.paso text{fill:#6A6A85}
.paso circle{fill:#2A2A3A}
.paso{animation:paso 4.4s linear infinite}
@keyframes paso{
  0%,4%{opacity:.45}
  7%,26%{opacity:1}
  30%,100%{opacity:.45}
}
.p1{animation-delay:0s}
.p2{animation-delay:.9s}
.p3{animation-delay:1.8s}
.p4{animation-delay:2.7s}
.mk{animation:mk 4.4s linear infinite}
@keyframes mk{
  0%,4%{fill:#2A2A3A}
  7%,26%{fill:#00E5FF}
  30%,100%{fill:#2A2A3A}
}
@media (prefers-reduced-motion:reduce){.paso,.mk{animation:none;opacity:1}}
</style>

<g clip-path="url(#mk)">
<rect width="1200" height="340" fill="#07070C"/>
<rect width="1200" height="3" fill="url(#top)"/>

<text class="m" x="72" y="112" font-size="12.5" letter-spacing="2.2" fill="#00E5FF">TU MÓVIL COMO MANDO DEL PC</text>
<text class="d" x="72" y="186" font-size="64" font-weight="700" letter-spacing="-2" fill="#F2F0FF">Key<tspan fill="#B026FF">Forge</tspan></text>
<text class="d" x="72" y="228" font-size="18" fill="#6A6A85">Sin hardware, sin cuentas y sin nube</text>
<text class="m" x="72" y="256" font-size="12.5" fill="#4E4E63">19 integraciones · todo en tu red local</text>

<line x1="762" y1="110" x2="762" y2="278" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>

<g class="paso p1">
<rect x="740" y="88" width="380" height="44" rx="10"/>
<circle class="mk p1" cx="762" cy="110" r="6"/>
<text class="m" x="790" y="115" font-size="13.5">pulsar Win+R</text>
</g>
<g class="paso p2">
<rect x="740" y="144" width="380" height="44" rx="10"/>
<circle class="mk p2" cx="762" cy="166" r="6"/>
<text class="m" x="790" y="171" font-size="13.5">esperar 400 ms</text>
</g>
<g class="paso p3">
<rect x="740" y="200" width="380" height="44" rx="10"/>
<circle class="mk p3" cx="762" cy="222" r="6"/>
<text class="m" x="790" y="227" font-size="13.5">escribir cmd</text>
</g>
<g class="paso p4">
<rect x="740" y="256" width="380" height="44" rx="10"/>
<circle class="mk p4" cx="762" cy="278" r="6"/>
<text class="m" x="790" y="283" font-size="13.5">pulsar Enter</text>
</g>

<text class="m" x="740" y="322" font-size="11.5" fill="#4E4E63">una macro, con su espera entre pasos</text>
</g>
</svg>
